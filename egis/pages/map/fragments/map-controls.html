<!-- 지도 컨트롤: 위치·확대·축소·측정·인쇄 -->
<div class="map-view__control">
  <div class="map-control" role="group" aria-label="지도 컨트롤">
    <div class="map-control__group">
      <button
        type="button"
        class="map-control__btn"
        aria-pressed="false"
        data-control-toggle
        data-tooltip-placement="left"
        aria-label="내 위치로 이동"
      >
        <i class="gps-icon" aria-hidden="true"></i>
        <span class="integrated-search__tooltip body3-r-14">내 위치로 이동</span>
        <span class="blind">내 위치로 이동</span>
      </button>
    </div>
    <div class="map-control__group">
      <button type="button" class="map-control__btn" data-tooltip-placement="left" aria-label="지도 확대">
        <i class="plus-icon" aria-hidden="true"></i>
        <span class="integrated-search__tooltip body3-r-14">지도 확대</span>
        <span class="blind">지도 확대</span>
      </button>
      <button type="button" class="map-control__btn" data-tooltip-placement="left" aria-label="지도 축소">
        <i class="minus-icon" aria-hidden="true"></i>
        <span class="integrated-search__tooltip body3-r-14">지도 축소</span>
        <span class="blind">지도 축소</span>
      </button>
    </div>
    <div class="map-control__group">
      <button
        type="button"
        class="map-control__btn"
        aria-pressed="false"
        data-control-toggle
        data-tooltip-placement="left"
        aria-label="전체화면으로 보기"
      >
        <i class="arrow-expand-icon" aria-hidden="true"></i>
        <span class="integrated-search__tooltip body3-r-14">전체화면으로 보기</span>
        <span class="blind">전체화면으로 보기</span>
      </button>
    </div>
    <div class="map-control__group">
      <button
        type="button"
        class="map-control__btn"
        aria-pressed="false"
        data-control-toggle
        data-tooltip-placement="left"
        aria-label="거리 측정"
      >
        <span class="body3-m-14">거리</span>
        <span class="integrated-search__tooltip body3-r-14">거리 측정</span>
      </button>
      <button
        type="button"
        class="map-control__btn"
        aria-pressed="false"
        data-control-toggle
        data-tooltip-placement="left"
        aria-label="면적 측정"
      >
        <span class="body3-m-14">면적</span>
        <span class="integrated-search__tooltip body3-r-14">면적 측정</span>
      </button>
    </div>
    <div class="map-control__group">
      <button type="button" class="map-control__btn" data-tooltip-placement="left" aria-label="현재 지도 화면 인쇄">
        <span class="body3-m-14">인쇄</span>
        <span class="integrated-search__tooltip body3-r-14">현재 지도 화면 인쇄</span>
      </button>
    </div>
  </div>
</div>
