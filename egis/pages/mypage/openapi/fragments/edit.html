<!-- Open API 개발계정 정보 수정 -->
<section class="mypage grid-column-default pt-48 pb-100" aria-label="마이페이지">
  <div data-fragment="../fragments/lnb.html"></div>

  <div class="mypage__main grid-column-10">
    <h2 class="heading6-sb-28 color-slate-900 m-0 mb-32">Open API 개발계정 정보 수정</h2>

    <form class="oa-edit flex flex-col gap-32" data-oa-edit-form>
      <div class="oa-edit__summary flex gap-28">
        <div class="oa-edit__summary-card flex-1">
          <p class="body2-r-16 color-gray-700 m-0">신청계정</p>
          <p class="body1-m-18 color-gray-900 m-0">개발계정</p>
        </div>
        <div class="oa-edit__summary-card flex-1">
          <p class="body2-r-16 color-gray-700 m-0">신청일</p>
          <p class="body1-m-18 color-gray-900 m-0">2025-12-29</p>
        </div>
        <div class="oa-edit__summary-card flex-1">
          <p class="body2-r-16 color-gray-700 m-0">유효기간</p>
          <p class="body1-m-18 color-gray-900 m-0">2027-12-29</p>
        </div>
      </div>

      <div class="oa-edit__section flex flex-col gap-28">
        <h3 class="heading9-sb-22 color-gray-900 m-0">이용 정보</h3>
        <hr class="oa-edit__divider" />

        <div class="oa-edit__fields flex flex-col gap-28">
          <div class="oa-edit__row flex gap-28">
            <div class="oa-edit__field flex-1 flex flex-col gap-6">
              <label for="oa-edit-service-name" class="body2-m-16 color-gray-900">활용 서비스명</label>
              <input
                id="oa-edit-service-name"
                type="text"
                class="input-field-default-48 w-full"
                value="환경공간정보서비스"
                data-oa-edit-service-name
              />
            </div>
            <div class="oa-edit__field flex-1 flex flex-col gap-6">
              <label for="oa-edit-service-type" class="body2-m-16 color-gray-900">서비스 유형</label>
              <select id="oa-edit-service-type" class="select-48 w-full" data-oa-edit-service-type>
                <option value="" selected disabled hidden>선택해주세요</option>
                <option value="web">웹 기반 서비스</option>
                <option value="mobile">모바일 기반 서비스</option>
                <option value="analysis">데이터 분석·시각화</option>
                <option value="internal">내부 시스템</option>
                <option value="research">연구·학술 목적</option>
                <option value="etc">기타</option>
              </select>
            </div>
          </div>

          <div class="oa-edit__field flex flex-col gap-6">
            <label for="oa-edit-service-url" class="body2-m-16 color-gray-900">활용 서비스 URL</label>
            <input
              id="oa-edit-service-url"
              type="text"
              class="input-field-default-48 w-full"
              value="www.nature.com"
              data-oa-edit-service-url
            />
          </div>

          <div class="oa-edit__field oa-edit__purpose flex flex-col gap-6">
            <label for="oa-edit-purpose" class="body2-m-16 color-slate-900">활용 목적</label>
            <div class="textarea-wrapper relative">
              <textarea
                id="oa-edit-purpose"
                class="oa-edit__textarea"
                maxlength="1000"
                data-oa-edit-purpose
              >OOO 논문의 연구자료로 참고</textarea>
              <span class="oa-edit__counter body2-r-16" aria-live="polite">
                <span class="counter" data-oa-edit-count>24</span>
                <span class="color-slate-400"> / 1000</span>
              </span>
            </div>
          </div>
        </div>

        <div class="oa-edit__actions flex align-center justify-center gap-8 pt-48">
          <a href="./detail.html" class="border-slate-button-48 body2-m-16 oa-edit__cancel">취소</a>
          <button type="submit" class="blue-button-48 body2-m-16 oa-edit__submit">변경사항 저장</button>
        </div>
      </div>
    </form>
  </div>
</section>
