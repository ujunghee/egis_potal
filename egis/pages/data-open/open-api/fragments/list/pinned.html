<section class="tp-pin mt-24 mb-24" data-pin-panel hidden aria-labelledby="pin-title">
      <div class="tp-pin__head flex align-center justify-between mb-16">
        <h2 id="pin-title" class="body1-sb-18 color-slate-900">
          고정된 데이터셋 <span class="color-blue-500" data-pin-count>0</span>
        </h2>
        <button type="button" class="tp-pin__reset flex align-center gap-10" data-pin-reset>
          <span class="body2-m-16 color-slate-700">초기화</span>
          <i class="applied-reset-icon" aria-hidden="true"></i>
          <span class="blind">고정된 데이터셋 초기화</span>
        </button>
      </div>
      <ul class="tp-pin__list" data-pin-list aria-label="고정된 데이터셋 목록"></ul>
    </section>
